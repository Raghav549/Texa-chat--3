services:
  - type: web
    name: texa
    runtime: node
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheckPath: /health
    healthCheckInterval: 30
    maxInstances: 3
    minInstances: 1
    autoDeploy: true
